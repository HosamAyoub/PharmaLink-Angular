<div class="profile-tabs">
  <!-- Personal Information Tab -->
  <button
    class="profile-tab"
    [class.active]="activeTab() === 'personal'"
    (click)="switchTab('personal')"
  >
    <span class="tab-icon"><i class="bi bi-person"></i></span>
    <span class="tab-text">Personal Info</span>
  </button>

  <!-- Medical Info Tab -->
  <button
    class="profile-tab"
    [class.active]="activeTab() === 'medical'"
    (click)="switchTab('medical')"
  >
    <span class="tab-icon"><i class="bi bi-hospital"></i></span>
    <span class="tab-text">Medical Info</span>
  </button>

  <!-- Order History Tab -->
  <button
    class="profile-tab"
    [class.active]="activeTab() === 'orders'"
    (click)="switchTab('orders')"
  >
    <span class="tab-icon"><i class="bi bi-bag"></i></span>
    <span class="tab-text">Order History</span>
  </button>

  <!-- Settings Tab -->
  <button
    class="profile-tab"
    [class.active]="activeTab() === 'settings'"
    (click)="switchTab('settings')"
  >
    <span class="tab-icon"><i class="bi bi-gear"></i></span>
    <span class="tab-text">Settings</span>
  </button>
</div>
