<div
  class="d-flex flex-column justify-content-center align-items-center text-center w-100"
  style="padding: 64px; background-color: var(--section-bg-light)"
>
  <p style="font-weight: bold; font-size: 30px; margin-bottom: 32px">
    Shop by Category
  </p>
  <!-- This section used to highlight the categories offered by the pharmacy -->

  <!-- Desktop/Tablet Layout (md and above) -->
  <div
    class="d-md-flex d-none justify-content-center align-items-stretch flex-wrap category-cards-container"
  >
    <!--category card -->
    @for (category of categories; track category.name) {
    <!-- <div
      class="category-card-wrapper"
      [routerLink]="['/client/products', category.name]"
    >
      <div class="card text-center">
        <img
          [src]="category.image"
          [alt]="category.name"
          class="icon mx-auto d-block"
        />
        <div class="card-body">
          <h5 class="card-title">{{ category.name }}</h5>
          <p class="card-text">{{ category.description }}</p>
        </div>
      </div>
    </div> -->
    <app-category [category]="category"></app-category>
    }
    <a
      class="view-all-link"
      (click)="viewAllCategories()"
      [routerLink]="['/client/categories']"
    >
      View All Categories
    </a>
  </div>

  <!-- Mobile Layout (sm and below) - Carousel -->
  <div
    id="categoriesCarousel"
    class="carousel slide d-md-none"
    data-bs-ride="carousel"
    data-bs-interval="3000"
    data-bs-pause="hover"
    data-bs-wrap="true"
  >
    <div class="carousel-inner">
      @for (category of categories; track category.name; let i = $index) {
      <div class="carousel-item" [class.active]="i === 0">
        <div class="d-flex justify-content-center">
          <app-category [category]="category"></app-category>
        </div>
      </div>
      }
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#categoriesCarousel"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#categoriesCarousel"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- View All Link for Mobile -->
  <div class="d-md-none mt-3">
    <a
      class="view-all-link"
      (click)="viewAllCategories()"
      [routerLink]="['/client/categories']"
    >
      View All Categories
    </a>
  </div>
</div>
